name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: tag_version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get version from package.json
        id: package_version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Pomohardo ${{ steps.tag_version.outputs.VERSION || steps.package_version.outputs.VERSION }}
          body: |
            ## Changes
            See the assets below to download and install this version.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    permissions:
      contents: write
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxcb1-dev libx11-dev libxtst-dev \
            rpm libfuse2

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage,updater'

      - name: Upload to releases repo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${RELEASES_TOKEN}@github.com/shenghsi/pomohardo-releases.git releases-repo
          
          echo "=== Listing bundle directories ==="
          ls -la src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/ || echo "Bundle directory not found"
          
          # Copy updater files (includes .tar.gz and .tar.gz.sig)
          # These are generated because we included 'appimage' and 'updater' in bundles
          echo "=== Copying AppImage updater files ==="
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz releases-repo/ 2>/dev/null && echo "Copied AppImage tar.gz" || echo "No AppImage tar.gz found"
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig releases-repo/ 2>/dev/null && echo "Copied AppImage signature" || echo "No AppImage signature found"
          
          # Copy executables/installers for direct download
          echo "=== Copying AppImage executable ==="
          # The raw .AppImage file (not the .tar.gz updater one)
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/ -name "*.AppImage" -not -name "*.tar.gz" -exec cp {} releases-repo/ \; 2>/dev/null && echo "Copied AppImage" || echo "No AppImage found"
          
          echo "=== Copying DEB installer ==="
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb releases-repo/ 2>/dev/null && echo "Copied DEB installer" || echo "No DEB installer found"

          echo "=== Copying RPM installer ==="
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm releases-repo/ 2>/dev/null && echo "Copied RPM installer" || echo "No RPM installer found"
          
          echo "=== Files in releases-repo ==="
          ls -la releases-repo/
          
          cd releases-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No files to commit"
          else
            git commit -m "Release ${{ github.ref_name }} - Linux"
            git push
            echo "Successfully pushed Linux release files"
          fi

  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target x86_64-pc-windows-msvc --bundles msi,nsis,updater'

      - name: Upload to releases repo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          git clone https://x-access-token:${RELEASES_TOKEN}@github.com/shenghsi/pomohardo-releases.git releases-repo
          
          echo "=== Listing bundle directories ==="
          ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/ || echo "Bundle directory not found"
          
          echo "=== MSI directory contents ==="
          ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/ || echo "MSI directory not found"
          
          echo "=== NSIS directory contents ==="
          ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ || echo "NSIS directory not found"
          
          # Copy updater files (includes .msi.zip and .msi.zip.sig)
          echo "=== Copying MSI updater files ==="
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip releases-repo/ 2>/dev/null && echo "Copied MSI zip files" || echo "No MSI zip files found"
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip.sig releases-repo/ 2>/dev/null && echo "Copied MSI signature files" || echo "No MSI signature files found"
          
          echo "=== Copying NSIS updater files ==="
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip releases-repo/ 2>/dev/null && echo "Copied NSIS zip files" || echo "No NSIS zip files found"
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig releases-repo/ 2>/dev/null && echo "Copied NSIS signature files" || echo "No NSIS signature files found"
          
          # Copy installers for direct download
          echo "=== Copying MSI installer ==="
          for file in src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi; do
            if [ -f "$file" ] && [[ ! "$file" =~ \.zip$ ]]; then
              cp "$file" releases-repo/
              echo "Copied: $(basename "$file")"
            fi
          done
          
          echo "=== Copying NSIS installer ==="
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe releases-repo/ 2>/dev/null && echo "Copied EXE installer" || echo "No EXE installer found"
          
          echo "=== Files in releases-repo ==="
          ls -la releases-repo/
          
          cd releases-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No files to commit"
          else
            git commit -m "Release ${{ github.ref_name }} - Windows"
            git push
            echo "Successfully pushed Windows release files"
          fi

  build-macos:
    needs: create-release
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --bundles app,dmg,updater

      - name: Upload to releases repo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${RELEASES_TOKEN}@github.com/shenghsi/pomohardo-releases.git releases-repo
          
          echo "=== Listing bundle directories ==="
          ls -la src-tauri/target/${{ matrix.rust_target }}/release/bundle/ || echo "Bundle directory not found"
          
          # Copy updater files (includes .tar.gz and .tar.gz.sig)
          echo "=== Copying macOS updater files ==="
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz releases-repo/ 2>/dev/null && echo "Copied app tar.gz" || echo "No app tar.gz found"
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz.sig releases-repo/ 2>/dev/null && echo "Copied app signature" || echo "No app signature found"
          
          # Copy DMG for direct download
          echo "=== Copying DMG installer ==="
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg releases-repo/ 2>/dev/null && echo "Copied DMG installer" || echo "No DMG installer found"
          
          echo "=== Files in releases-repo ==="
          ls -la releases-repo/
          
          cd releases-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No files to commit"
          else
            git commit -m "Release ${{ github.ref_name }} - macOS ${{ matrix.rust_target }}"
            git push
            echo "Successfully pushed macOS release files"
          fi


  merge-manifests:
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json from updater files
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${RELEASES_TOKEN}@github.com/shenghsi/pomohardo-releases.git releases-repo
          cd releases-repo
          
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Create latest.json with all platforms
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
          EOF
          
          # Add Linux platform
          if ls *.AppImage.tar.gz 2>/dev/null; then
            LINUX_FILE=$(ls *.AppImage.tar.gz | head -n 1)
            LINUX_SIG=$(cat ${LINUX_FILE}.sig 2>/dev/null || echo "")
            cat >> latest.json << EOF
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://shenghsi.github.io/pomohardo-releases/$LINUX_FILE"
              },
          EOF
          fi
          
          # Add Windows platform
          if ls *.msi.zip 2>/dev/null; then
            WIN_FILE=$(ls *.msi.zip | head -n 1)
            WIN_SIG=$(cat ${WIN_FILE}.sig 2>/dev/null || echo "")
            cat >> latest.json << EOF
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://shenghsi.github.io/pomohardo-releases/$WIN_FILE"
              },
          EOF
          elif ls *.nsis.zip 2>/dev/null; then
            WIN_FILE=$(ls *.nsis.zip | head -n 1)
            WIN_SIG=$(cat ${WIN_FILE}.sig 2>/dev/null || echo "")
            cat >> latest.json << EOF
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://shenghsi.github.io/pomohardo-releases/$WIN_FILE"
              },
          EOF
          fi
          
          # Add macOS platforms
          for arch in x86_64 aarch64; do
            if ls *${arch}*.app.tar.gz 2>/dev/null; then
              MAC_FILE=$(ls *${arch}*.app.tar.gz | head -n 1)
              MAC_SIG=$(cat ${MAC_FILE}.sig 2>/dev/null || echo "")
              DARWIN_ARCH="darwin-${arch}"
              cat >> latest.json << EOF
              "$DARWIN_ARCH": {
                "signature": "$MAC_SIG",
                "url": "https://shenghsi.github.io/pomohardo-releases/$MAC_FILE"
              },
          EOF
            fi
          done
          
          # Remove trailing comma and close JSON
          sed -i '$ s/,$//' latest.json
          cat >> latest.json << EOF
            }
          }
          EOF
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "Update manifest for ${{ github.ref_name }}" || true
          git push

      - name: Update README with latest version
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cd releases-repo
          
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Update version numbers in README
          if [ -f README.md ]; then
            sed -i "s/x\.x\.x/$VERSION/g" README.md
            git add README.md
            git commit -m "Update README version to $VERSION" || true
            git push
          fi
