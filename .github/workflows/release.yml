name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.tag_version.outputs.VERSION || steps.package_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get version from package.json
        id: package_version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Pomohardo ${{ steps.tag_version.outputs.VERSION || steps.package_version.outputs.VERSION }}
          body: |
            ## Changes
            See the assets below to download and install this version.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxcb1-dev libx11-dev libxtst-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target x86_64-unknown-linux-gnu --bundles appimage,deb,updater'

  build-linux-rpm:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y curl wget file gcc openssl-devel \
            webkit2gtk4.1-devel libappindicator-gtk3-devel \
            librsvg2-devel rpm-build nodejs npm \
            libxdo-devel libX11-devel libXtst-devel libxcb-devel

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target x86_64-unknown-linux-gnu --bundles rpm'

  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--bundles msi,nsis,updater'

  build-macos:
    needs: create-release
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            rust_target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --bundles app,dmg,updater

  publish-release:
    needs: [build-linux-deb, build-linux-rpm, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Download release asset list
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          # Start building latest.json
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
          EOF

          FIRST=true

          # Linux
          LINUX_FILE=$(echo "$ASSETS" | grep -E '\.AppImage\.tar\.gz$' | head -n 1 || true)
          if [ -n "$LINUX_FILE" ]; then
            LINUX_SIG=$(gh release download "$TAG" --repo "$REPO" --pattern "${LINUX_FILE}.sig" --output - 2>/dev/null || echo "")
            [ "$FIRST" = false ] && echo ',' >> latest.json
            cat >> latest.json << EOF
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "${BASE_URL}/${LINUX_FILE}"
              }
          EOF
            FIRST=false
          fi

          # Windows
          WIN_FILE=$(echo "$ASSETS" | grep -E '\.(msi|nsis)\.zip$' | head -n 1 || true)
          if [ -n "$WIN_FILE" ]; then
            WIN_SIG=$(gh release download "$TAG" --repo "$REPO" --pattern "${WIN_FILE}.sig" --output - 2>/dev/null || echo "")
            [ "$FIRST" = false ] && echo ',' >> latest.json
            cat >> latest.json << EOF
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "${BASE_URL}/${WIN_FILE}"
              }
          EOF
            FIRST=false
          fi

          # macOS
          for arch in x86_64 aarch64; do
            asset_arch="$arch"
            [ "$arch" = "x86_64" ] && asset_arch="x64"
            MAC_FILE=$(echo "$ASSETS" | grep -E "\.app\.tar\.gz$" | grep "$asset_arch" | head -n 1 || true)
            if [ -n "$MAC_FILE" ]; then
              MAC_SIG=$(gh release download "$TAG" --repo "$REPO" --pattern "${MAC_FILE}.sig" --output - 2>/dev/null || echo "")
              [ "$FIRST" = false ] && echo ',' >> latest.json
              cat >> latest.json << EOF
              "darwin-${arch}": {
                "signature": "$MAC_SIG",
                "url": "${BASE_URL}/${MAC_FILE}"
              }
          EOF
              FIRST=false
            fi
          done

          # Close JSON
          echo '' >> latest.json
          cat >> latest.json << EOF
            }
          }
          EOF

          # Upload latest.json as a release asset
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          # Publish the draft release
          gh release edit "$TAG" --repo "$REPO" --draft=false
