<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Pomohardo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            -webkit-user-select: none;
            user-select: none;
            cursor: default;
            /* Ensure background matches main app if styles.css didn't cover it (it does, but just in case) */
            background: #2b2b2b;
            color: #ffffff;
            height: 100vh;
            margin: 0;
        }

        #logo {
            width: 100px;
            height: 100px;
            padding: 20px;
            /* margin-top: 30px;
            margin-bottom: 20px; */
            /* Circular background for the logo if needed, matching screenshot */
            /* background: #3a3a3a; */
            /* border-radius: 50%; */
            /* padding: 10px; */
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .version {
            font-size: 16px;
            color: #888;
            margin-bottom: 20px;
        }

        .description {
            font-size: 14px;
            color: #ccc;
            /* margin-bottom: 10px; */
            line-height: 1.5;
            max-width: 80%;
        }

        .copyright {
            font-size: 12px;
            color: #666;
            margin-top: auto;
            /* margin-bottom: 10px; */
        }

        .update-container {
            margin-top: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            /* Pre-allocate space to avoid jumping */
        }

        #updateStatus {
            color: #aaa;
        }

        #updateActionBtn {
            background-color: #fca311;
            color: #1e1e1e;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        #updateActionBtn:hover {
            opacity: 0.9;
        }

        #updateActionBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #555;
            color: #bbb;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <img id="logo" alt="Pomohardo Logo">
    <h1>Pomohardo</h1>
    <div class="version">Version <span id="version">...</span></div>
    <div class="description">
        A cross-platform pomodoro timer that enforces breaks.
    </div>

    <div id="updateContainer" class="update-container">
        <div id="updateStatus">Checking for updates...</div>
        <button id="updateActionBtn" class="hidden">Update</button>
    </div>

    <div class="copyright">Copyright © <span id="year"></span></div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        let currentVersion = 'Unknown';

        function compareVersions(v1, v2) {
            const parts1 = v1.split('.').map(Number);
            const parts2 = v2.split('.').map(Number);
            for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
                const num1 = parts1[i] || 0;
                const num2 = parts2[i] || 0;
                if (num1 > num2) return 1;
                if (num1 < num2) return -1;
            }
            return 0;
        }

        async function checkForUpdates() {
            const statusEl = document.getElementById('updateStatus');
            const actionBtn = document.getElementById('updateActionBtn');

            statusEl.textContent = 'Checking for updates...';
            statusEl.style.color = '#aaa';
            actionBtn.classList.add('hidden');
            actionBtn.disabled = false;

            try {
                const isLinux = navigator.platform.toLowerCase().includes('linux');
                let foundUpdate = null;

                if (isLinux) {
                    const response = await fetch('https://shenghsi.github.io/pomohardo-releases/latest.json?t=' + Date.now());
                    if (response.ok) {
                        const data = await response.json();
                        if (data.version && currentVersion !== 'Unknown') {
                            if (compareVersions(data.version, currentVersion) > 0) {
                                foundUpdate = { version: data.version, isDeb: true };
                            }
                        }
                    }
                }

                // If no update found through Linux manual check, try Tauri updater
                if (!foundUpdate) {
                    try {
                        const updateObj = await invoke('check_for_updates_custom');
                        if (updateObj && updateObj.available) {
                            foundUpdate = { version: updateObj.version, isDeb: false };
                        }
                    } catch (err) {
                        console.log("Native updater check skipped/failed:", err);
                        // This is completely expected on Linux .deb and missing dev mode contexts.
                    }
                }

                if (foundUpdate) {
                    statusEl.textContent = `Update available: v${foundUpdate.version}`;
                    statusEl.style.color = '#2ECC71'; // Green

                    if (foundUpdate.isDeb) {
                        actionBtn.textContent = 'Download Update';
                        actionBtn.onclick = async () => {
                            await invoke('open_browser', { url: `https://shenghsi.github.io/pomohardo-releases/Pomohardo_${foundUpdate.version}_amd64.deb` });
                        };
                    } else {
                        actionBtn.textContent = 'Install Update';
                        actionBtn.onclick = async () => {
                            actionBtn.disabled = true;
                            actionBtn.textContent = 'Downloading...';
                            statusEl.textContent = 'Downloading update, please wait...';
                            statusEl.style.color = '#aaa';

                            try {
                                await invoke('install_update_custom');
                                await invoke('relaunch_app_custom');
                            } catch (err) {
                                console.error(err);
                                statusEl.textContent = 'Failed to install update.';
                                statusEl.style.color = '#ff4444';
                                actionBtn.classList.add('hidden');
                            }
                        };
                    }
                    actionBtn.classList.remove('hidden');
                } else {
                    statusEl.textContent = 'Pomohardo is up to date.';
                    statusEl.style.color = '#888';
                }
            } catch (error) {
                console.error('Update check failed:', error);
                statusEl.textContent = 'Failed to check for updates.';
                statusEl.style.color = '#ff4444';
            }
        }

        async function loadInfo() {
            try {
                const info = await invoke('get_about_info');
                currentVersion = info.version;
                document.getElementById('version').textContent = currentVersion;
                document.getElementById('logo').src = info.icon_base64;
                document.getElementById('year').textContent = new Date().getFullYear();

                await checkForUpdates();
            } catch (e) {
                console.error('Failed to load about info:', e);
                document.getElementById('version').textContent = 'Unknown';
            }
        }

        // Listen for triggered checks from tray
        listen('check-updates', () => {
            checkForUpdates();
        });

        // Wait for DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadInfo);
        } else {
            loadInfo();
        }
    </script>
</body>

</html>
