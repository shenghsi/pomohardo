<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomohardo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="timer">Timer</button>
            <button class="tab" data-tab="stats">Stats</button>
            <button class="settings-btn" id="settingsBtn">⚙</button>
        </div>

        <!-- Timer Tab -->
        <div class="tab-content active" id="timerTab">
            <div class="timer-container">
                <svg class="circular-timer" viewBox="0 0 200 200">
                    <circle class="timer-bg" cx="100" cy="100" r="98" />
                    <circle class="timer-progress-bg" cx="100" cy="100" r="98" />
                    <circle class="timer-progress" cx="100" cy="100" r="98" id="progressCircle" />
                </svg>
                <div class="timer-content">
                    <div class="phase-label" id="phaseLabel">Pomodoro</div>
                    <div class="time-display" id="timeDisplay">25:00</div>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="pauseBtn" title="Pause">
                    <img id="pauseIcon" src="pause.svg" alt="Pause" />
                </button>
                <button class="control-btn" id="skipBtn" title="Skip">
                    <img src="skip-forward.svg" alt="Skip" />
                </button>
            </div>

            <div class="info">
                <div class="session-count">Session: <span id="sessionCount">0</span></div>
                <div class="break-debt" id="breakDebt">Break debt: 0s</div>
                <div class="emergency-skips" id="emergencySkips">Emergency skips left: 2/2</div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content" id="statsTab">
            <div class="stats-container">
                <h2>Statistics</h2>
                <div class="stat-item">
                    <span>Sessions Today:</span>
                    <span id="sessionsToday">0</span>
                </div>
                <div class="stat-item">
                    <span>Emergency Skips Today:</span>
                    <span id="emergencySkipsToday">0</span>
                </div>
                <div class="stat-item">
                    <span>Break Debt:</span>
                    <span id="breakDebtStat">0 minutes</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Break screen is created dynamically in breakshield mode only (see main.js) -->

    <script src="main.js"></script>
</body>

</html>
